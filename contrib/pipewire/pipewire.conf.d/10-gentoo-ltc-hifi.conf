# High-fidelity defaults for Lenovo ThinkCentre M75s Gen 2.
# PipeWire may select one of these graph rates when devices are idle. ALSA still
# negotiates the actual rate and format with every output, so unsupported rates
# are never forced on the ALC623 or an HDMI display.

context.properties = {
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
    default.clock.quantum = 1024
    default.clock.min-quantum = 32
    default.clock.max-quantum = 8192
}

stream.properties = {
    resample.quality = 10
}
