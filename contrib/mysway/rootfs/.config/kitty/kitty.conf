# Kitty para MySway: paleta carbón neutral, sin alterar Konsole ni Plasma.
font_family      monospace
font_size        11.0

foreground       #f4f4f5
background       #09090b
selection_foreground #09090b
selection_background #d4d4d8
cursor           #d4d4d8
cursor_text_color #09090b

url_color        #a1a1aa
active_border_color #a1a1aa
inactive_border_color #27272a
bell_border_color #e0af68

window_padding_width 8
background_opacity 1.0
confirm_os_window_close 0
enable_audio_bell no
remember_window_size yes
