# Xiaomi A22FAB-RAGL: usa el modo nativo de 75 Hz anunciado por el monitor.
output HDMI-A-1 mode 1920x1080@75Hz position 0 0

# DZM FHSD20VF01: el identificador persistente evita depender de DP-1.
output "DZM FHSD20VF01 0000000000001" mode 1920x1080@100.054Hz

# Sway atiende el interruptor directamente: no hace falta un daemon residente.
# --reload aplica el estado real de la tapa también al iniciar o recargar Sway.
bindswitch --reload lid:on output eDP-1 disable
bindswitch --reload lid:off output eDP-1 enable
