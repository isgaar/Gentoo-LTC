# Entorno de la sesión
#
# Las variables XDG se definen en session.sh, no con comandos inexistentes
# como "setenv". Se importan aquí cuando WAYLAND_DISPLAY y SWAYSOCK ya existen.
exec_always dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE

set $mod Mod4
set $term kitty
set $menu wofi --show drun --allow-images --insensitive
set $file_manager dolphin

focus_on_window_activation smart
xwayland enable
