# Componentes de escritorio. Ninguno modifica o detiene servicios de Plasma.
exec_always sh -c 'pkill -x waybar >/dev/null 2>&1 || true; exec env -u LC_ALL LANG=es_MX.UTF-8 LC_TIME=es_MX.utf8 waybar'
exec mako

# El bloqueo automático está deshabilitado. El bloqueo manual sigue disponible
# mediante Super+Ctrl+L.

# Agente de autenticación disponible en Plasma/Gentoo, limitado a esta sesión.
exec sh -c 'if [ -x /usr/libexec/polkit-kde-authentication-agent-1 ]; then exec /usr/libexec/polkit-kde-authentication-agent-1; elif command -v lxqt-policykit-agent >/dev/null 2>&1; then exec lxqt-policykit-agent; fi'
