# Sway 1.11 estándar: sin blur, sombras ni corner_radius de SwayFX.
font pango:Noto Sans SemiBold 10
title_align center
titlebar_padding 6 4

default_border pixel 2
default_floating_border normal 2
hide_edge_borders smart

gaps inner 6
gaps outer 8
smart_gaps on
smart_borders on

# class                     border   background text     indicator child_border
client.focused              #a1a1aa  #18181b    #f4f4f5 #d4d4d8   #a1a1aa
client.focused_inactive     #3f3f46  #141416    #a1a1aa #3f3f46   #3f3f46
client.unfocused            #27272a  #101012    #71717a #27272a   #27272a
client.urgent               #f7768e  #24141b    #ffffff #f7768e   #f7768e
client.placeholder          #27272a  #101012    #71717a #27272a   #27272a
client.background           #09090b

# Un color sólido siempre existe y evita que un wallpaper borrado invalide todo
# el config. 99-local.conf muestra cómo configurar un fondo personalizado.
output * bg #09090b solid_color
