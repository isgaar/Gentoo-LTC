# Prefer the best available A2DP profile. PipeWire's BlueZ monitor keeps its
# distribution defaults for the codec list, which means it can use newly added
# codecs and only advertises codecs built into the local package.
#
# Do not force LDAC HQ: 990 kb/s is less reliable in congested RF environments.
# The default adaptive LDAC mode and automatic SBC-XQ hardware quirks provide a
# better quality/reliability balance. Bluetooth codecs remain lossy.
wireplumber.settings = {
  bluetooth.profile-preference = "quality"
}
